name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Lower bound is the engines floor; upper is current LTS.
        node: [20, 22]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      - name: Build
        run: npm run build

      # Contract tests only. The smoke suite hits real Google APIs and is
      # excluded by vitest.config.ts, so CI can never touch live data or need
      # credentials.
      - name: Contract tests
        run: npm test

      - name: Confirm gate (D6)
        run: node scripts/verify-confirm-gate.mjs

      # Guards against a credential or fixture reaching the published tarball.
      - name: Verify package contents
        run: |
          npm pack --dry-run 2>&1 | tee /tmp/pack.txt
          if grep -Eiq 'client_secret|token-|service-account|\.env|credentials\.json' /tmp/pack.txt; then
            echo "::error::Potential credential in package contents"
            exit 1
          fi
          if grep -Eq 'test/|scripts/' /tmp/pack.txt; then
            echo "::error::Tests or scripts leaked into the tarball"
            exit 1
          fi
